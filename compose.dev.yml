# EIC FC 本地开发环境：PostgreSQL + MinIO
# Next.js 开发服务器运行在宿主机（Windows），便于热更新。

name: eicfc-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eicfc
      POSTGRES_PASSWORD: eicfc_dev_password
      POSTGRES_DB: eicfc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eicfc -d eicfc"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      # minio 镜像不含 mc；使用内置健康端点
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/eicfc &&
      mc anonymous set none local/eicfc &&
      echo 'bucket eicfc ready'
      "
    restart: "no"

volumes:
  pgdata:
  miniodata:
