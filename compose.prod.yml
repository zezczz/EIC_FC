# EIC FC 生产编排：Caddy + app + PostgreSQL + MinIO
# 数据库与 MinIO 仅内部网络；仅 80/443 对公网开放。
# APP_URL / TRUSTED_ORIGINS / S3_PUBLIC_BASE_URL 从 .env 读取：
# 本机先用 http://localhost:3000，解析域名后改为 https://czzczzzez.cloud

name: eicfc-prod

services:
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    mem_limit: 96m
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?CADDY_ACME_EMAIL is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs/ip.crt:/etc/caddy/certs/ip.crt:ro
      - ./certs/ip.key:/etc/caddy/certs/ip.key:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - edge
      - internal

  app:
    image: eicfc-app:prod
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      TRUST_PROXY: "true"
      APP_URL: ${APP_URL:?APP_URL is required}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:?TRUSTED_ORIGINS is required}
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?S3_PUBLIC_BASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:3000/api/health/live",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - internal
    expose:
      - "3000"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 256m
    shm_size: 64m
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=50"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eicfc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-eicfc}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eicfc} -d ${POSTGRES_DB:-eicfc}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    mem_limit: 256m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      MINIO_BROWSER: "off"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    expose:
      - "9000"

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-eicfc}
    volumes:
      - ./deploy/minio-cors.json:/cors.json:ro
      - ./deploy/minio-init.sh:/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    restart: "no"
    networks:
      - internal

  ops:
    profiles: ["ops"]
    image: eicfc-ops:prod
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    env_file:
      - .env
    environment:
      NODE_ENV: production
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?S3_PUBLIC_BASE_URL is required}
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    entrypoint: ["pnpm"]
    command: ["db:deploy"]
    networks:
      - internal

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:

networks:
  edge:
  internal:
